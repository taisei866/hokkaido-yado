name: 宿データ更新（OpenStreetMap）

on:
  schedule:
    - cron: '0 18 1 * *'   # 毎月2日 3:00（日本時間）
  workflow_dispatch:        # Actions タブの「Run workflow」で手動実行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-osm.js
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/hotels.json
          git diff --cached --quiet || git commit -m "宿データを更新"
          git push
